# Build de Vite → dist/, funciones Netlify en netlify/functions/
# Redirección /api/* → la función correspondiente (p. ej. /api/sugerencias)
# prompts/** se inyecta en el bundle de la función (system prompt del asistente).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["prompts/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
